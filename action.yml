name: cargo-affect
description: Plan affected Rust workspace package checks from git changes.

inputs:
  workspace:
    description: Cargo workspace root or manifest path.
    default: "."
  base:
    description: Git base ref to diff against, or auto for pull_request/push detection.
    default: "auto"
  config:
    description: Optional affect.toml path.
    default: ""
  set:
    description: Optional comma-separated package set names from affect.toml.
    default: ""
  platform:
    description: Optional platform policy name. Defaults to cargo-affect's host OS.
    default: ""
  profile:
    description: Optional CI profile from affect.toml.
    default: ""
  backend:
    description: CI/cache backend recipe name, for downstream matrix/cache consumers.
    default: "auto"
  stage:
    description: Optional CI task stage to run when run-tasks is true.
    default: ""
  run-tasks:
    description: Run selected CI profile tasks after planning.
    default: "false"
  version:
    description: cargo-affect release tag to install. Defaults to the action ref when it is a tag; otherwise builds from source.
    default: ""

outputs:
  packages:
    description: Space-separated affected package names.
    value: ${{ steps.plan.outputs.packages }}
  package-args:
    description: Cargo package arguments, for example `-p crate-a -p crate-b`.
    value: ${{ steps.plan.outputs.package-args }}
  nextest-expr:
    description: cargo-nextest package filter expression.
    value: ${{ steps.plan.outputs.nextest-expr }}
  json:
    description: Full cargo-affect JSON plan.
    value: ${{ steps.plan.outputs.json }}
  base:
    description: Git base ref used for the plan.
    value: ${{ steps.plan.outputs.base }}
  profile:
    description: CI profile used for the plan, when configured.
    value: ${{ steps.plan.outputs.profile }}
  tasks:
    description: Full selected CI task JSON array.
    value: ${{ steps.plan.outputs.tasks }}
  task-ids:
    description: Space-separated selected CI task ids.
    value: ${{ steps.plan.outputs.task-ids }}
  empty:
    description: "true when no packages were selected."
    value: ${{ steps.plan.outputs.empty }}
  cache-group:
    description: Stable package group string for cache key dimensions.
    value: ${{ steps.plan.outputs.cache-group }}
  cache-key:
    description: Short stable hash of the cache group, safe for provider cache key limits.
    value: ${{ steps.plan.outputs.cache-key }}
  backend:
    description: Backend recipe requested by the workflow.
    value: ${{ steps.plan.outputs.backend }}
  runner:
    description: Current runner OS/architecture label.
    value: ${{ steps.plan.outputs.runner }}

runs:
  using: composite
  steps:
    - name: Install cargo-affect
      shell: bash
      env:
        CARGO_AFFECT_VERSION: ${{ inputs.version }}
        CARGO_AFFECT_ACTION_REF: ${{ github.action_ref }}
        CARGO_AFFECT_ACTION_PATH: ${{ github.action_path }}
      run: "$GITHUB_ACTION_PATH/scripts/install.sh"

    - name: Plan affected packages
      id: plan
      shell: bash
      env:
        INPUT_WORKSPACE: ${{ inputs.workspace }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_SET: ${{ inputs.set }}
        INPUT_PLATFORM: ${{ inputs.platform }}
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_BACKEND: ${{ inputs.backend }}
        INPUT_STAGE: ${{ inputs.stage }}
        INPUT_RUN_TASKS: ${{ inputs.run-tasks }}
      run: |
        set -euo pipefail

        base="$INPUT_BASE"
        if [ "$base" = "auto" ]; then
          base="$(python3 - <<'PY'
        import json
        import os

        event_name = os.environ.get("GITHUB_EVENT_NAME", "")
        event_path = os.environ.get("GITHUB_EVENT_PATH", "")
        event = {}
        if event_path:
            try:
                with open(event_path, "r", encoding="utf-8") as handle:
                    event = json.load(handle)
            except FileNotFoundError:
                pass

        if event_name == "pull_request" and os.environ.get("GITHUB_BASE_REF"):
            print(f"origin/{os.environ['GITHUB_BASE_REF']}")
        elif event_name == "push":
            before = event.get("before", "")
            if before and before.strip("0"):
                print(before)
            else:
                print("origin/main")
        else:
            print("origin/main")
        PY
          )"
        fi

        echo "Using diff base $base"
        args=(plan --workspace "$INPUT_WORKSPACE" --base "$base")

        if [ -n "$INPUT_CONFIG" ]; then
          args+=(--config "$INPUT_CONFIG")
        fi

        if [ -n "$INPUT_PLATFORM" ]; then
          args+=(--platform "$INPUT_PLATFORM")
        fi

        if [ -n "$INPUT_PROFILE" ]; then
          args+=(--profile "$INPUT_PROFILE")
        fi

        if [ -n "$INPUT_SET" ]; then
          IFS=',' read -ra sets <<< "$INPUT_SET"
          for set_name in "${sets[@]}"; do
            if [ -n "$set_name" ]; then
              args+=(--set "$set_name")
            fi
          done
        fi

        plan_file="$(mktemp)"
        cargo-affect "${args[@]}" > "$plan_file"

        python3 - "$plan_file" "$GITHUB_OUTPUT" "$INPUT_BACKEND" <<'PY'
        import hashlib
        import json
        import os
        import sys

        plan_path, output_path, backend = sys.argv[1:4]
        with open(plan_path, "r", encoding="utf-8") as handle:
            plan = json.load(handle)

        ci = plan.get("ci") or {}
        tasks = ci.get("tasks") or []
        task_ids = " ".join(task["id"] for task in tasks)
        backend_value = backend
        if backend_value == "auto":
            backend_value = ci.get("backend") or "auto"

        package_group = plan["cache_dimensions"]["package_group"]
        cache_group = package_group
        if ci.get("cache"):
            cache_group = f"{ci['cache']}-{package_group}" if package_group else ci["cache"]

        outputs = {
            "packages": " ".join(plan["packages"]),
            "package-args": plan["package_args"],
            "nextest-expr": plan["nextest_expr"],
            "empty": "true" if not plan["packages"] else "false",
            "base": plan["base"],
            "cache-group": cache_group,
            "cache-key": hashlib.sha256(cache_group.encode("utf-8")).hexdigest()[:16],
            "backend": backend_value,
            "profile": ci.get("profile", ""),
            "task-ids": task_ids,
            "runner": f"{os.environ.get('RUNNER_OS', '')}-{os.environ.get('RUNNER_ARCH', '')}".strip("-"),
        }

        with open(output_path, "a", encoding="utf-8") as output:
            for key, value in outputs.items():
                print(f"{key}={value}", file=output)
            print("tasks<<__CARGO_AFFECT_TASKS_JSON__", file=output)
            print(json.dumps(tasks, indent=2), file=output)
            print("__CARGO_AFFECT_TASKS_JSON__", file=output)
            print("json<<__CARGO_AFFECT_JSON__", file=output)
            print(json.dumps(plan, indent=2), file=output)
            print("__CARGO_AFFECT_JSON__", file=output)
        PY

        if [ "$INPUT_RUN_TASKS" = "true" ]; then
          run_args=(ci-run --workspace "$INPUT_WORKSPACE" --base "$base")

          if [ -n "$INPUT_CONFIG" ]; then
            run_args+=(--config "$INPUT_CONFIG")
          fi

          if [ -n "$INPUT_PLATFORM" ]; then
            run_args+=(--platform "$INPUT_PLATFORM")
          fi

          if [ -n "$INPUT_PROFILE" ]; then
            run_args+=(--profile "$INPUT_PROFILE")
          fi

          if [ -n "$INPUT_STAGE" ]; then
            run_args+=(--stage "$INPUT_STAGE")
          fi

          if [ -n "$INPUT_SET" ]; then
            IFS=',' read -ra sets <<< "$INPUT_SET"
            for set_name in "${sets[@]}"; do
              if [ -n "$set_name" ]; then
                run_args+=(--set "$set_name")
              fi
            done
          fi

          cargo-affect "${run_args[@]}"
        fi
