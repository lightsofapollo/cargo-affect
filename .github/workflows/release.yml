name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: linux-x86_64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            asset: linux-aarch64
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            asset: macos-x86_64
            target: ""
          - runner: macos-latest
            asset: macos-aarch64
            target: ""

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.target }}" ]; then
            rustup target add "${{ matrix.target }}"
            if [[ "${{ matrix.target }}" == *linux-musl ]]; then
              sudo apt-get update
              sudo apt-get install -y musl-tools
            fi
            cargo build --release --locked --target "${{ matrix.target }}"
            echo "CARGO_AFFECT_BUILD_DIR=target/${{ matrix.target }}/release" >> "$GITHUB_ENV"
          else
            cargo build --release --locked
            echo "CARGO_AFFECT_BUILD_DIR=target/release" >> "$GITHUB_ENV"
          fi
      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          tar -C "$CARGO_AFFECT_BUILD_DIR" -czf "dist/cargo-affect-${{ matrix.asset }}.tar.gz" cargo-affect
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-affect-${{ matrix.asset }}
          path: dist/cargo-affect-${{ matrix.asset }}.tar.gz

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
