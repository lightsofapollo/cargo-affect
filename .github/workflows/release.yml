name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: linux-x86_64
          - runner: ubuntu-24.04-arm
            asset: linux-aarch64
          - runner: macos-15-intel
            asset: macos-x86_64
          - runner: macos-latest
            asset: macos-aarch64

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release --locked
      - name: Package artifact
        run: |
          mkdir -p dist
          tar -C target/release -czf "dist/cargo-affect-${{ matrix.asset }}.tar.gz" cargo-affect
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-affect-${{ matrix.asset }}
          path: dist/cargo-affect-${{ matrix.asset }}.tar.gz

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
